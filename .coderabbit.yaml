# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "api/**/*.go"
      instructions: >-
        Enforce api/AGENTS.md. Layering is handler → service → repository: handlers never write SQL,
        services never import gin or touch *pgxpool.Pool, repositories hold no business rules.
        Every query on domain data filters by bolao_id, and writes target only the active bolão;
        flag a query without that filter as a data leak between seasons.
        SQL uses $n placeholders, never string concatenation. Errors return up; no log-and-continue.
        A scoring rule change must also change SCORING.md and scoring_test.go in the same PR.
        A new migration must be idempotent and listed in runMigrations.
        No comments at all (ADR 0009): flag every added comment and request its removal. Only tool
        directives are allowed (//go:, a bare //nolint:, generated-code headers).
        Focus on correctness bugs; skip style nits that gofmt or golangci-lint already cover.
    - path: "web/src/**/*.{ts,tsx}"
      instructions: >-
        Enforce web/AGENTS.md. The data path is api/*.ts → hooks/*.ts → page → component: components
        never call api<T>() and pages never call fetch. Server state uses TanStack Query only, with keys
        from shared/query/queryKeys.ts. Response interfaces keep the Go snake_case field names. No any.
        UI copy is Portuguese; identifiers are English.
        No comments at all (ADR 0009): flag every added comment and request its removal. Only
        /// <reference ...> and // eslint-disable-next-line <rule> are allowed.
    - path: "**/*_test.go"
      instructions: >-
        Table-driven tests whose case names state the rule. Fakes of interfaces, not mocks that call mocks.
        Flag tests of getters, constructors or framework behavior.
    - path: "web/src/**/*.test.{ts,tsx}"
      instructions: >-
        Test what the user sees through Testing Library queries, not props or state.
        Flag tests of Tailwind classes or implementation details.
    - path: "{api/migrations/*.sql,**/*.yml,**/*.yaml,**/Dockerfile,tools/**}"
      instructions: >-
        No comments at all (ADR 0009): flag every added comment and request its removal.
        Only shebangs, shellcheck directives, yaml-language-server lines and Dockerfile syntax lines are allowed.
