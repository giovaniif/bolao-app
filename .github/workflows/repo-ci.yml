name: Repo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint repo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Test tools
        run: go test ./...

      - name: Lint AGENTS.md
        run: go run ./lint-agents ..

      - name: Lint comments
        run: go run ./lint-comments -allow lint-comments/allowlist.txt ..
