name: Repo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint repo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Test tools
        run: go test ./...

      - name: Lint AGENTS.md
        run: go run ./lint-agents ..

      - name: Lint comments
        run: go run ./lint-comments ..

  tdd:
    name: Test first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check test-first
        run: cp tools/tdd-check "$RUNNER_TEMP/" && "$RUNNER_TEMP/tdd-check" "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
        env:
          TDD_PR_TITLE: ${{ github.event.pull_request.title }}

  mutate:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install gremlins
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOTOOLCHAIN: go1.26.10
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutate the service rules
        run: tools/mutate
