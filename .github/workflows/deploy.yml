name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy dev (staging)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy (bolao-api-dev)
        if: vars.API_HOST != 'cloudrun'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

      - name: Authenticate to Google Cloud
        if: vars.API_HOST == 'both' || vars.API_HOST == 'cloudrun'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy bolao-api-dev to Cloud Run
        if: vars.API_HOST == 'both' || vars.API_HOST == 'cloudrun'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: bolao-api-dev
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: ./api
          env_vars: RENDER_GIT_COMMIT=${{ github.sha }}
          env_vars_update_strategy: merge
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (preview = dev)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Point stable dev alias at this deployment
        run: vercel alias set "${{ steps.deploy.outputs.url }}" bolao-app-dev.vercel.app --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-prod:
    name: Deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy (bolao-api)
        if: vars.API_HOST != 'cloudrun'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"

      - name: Authenticate to Google Cloud
        if: vars.API_HOST == 'both' || vars.API_HOST == 'cloudrun'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy bolao-api to Cloud Run
        if: vars.API_HOST == 'both' || vars.API_HOST == 'cloudrun'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: bolao-api
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: ./api
          env_vars: RENDER_GIT_COMMIT=${{ github.sha }}
          env_vars_update_strategy: merge
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
