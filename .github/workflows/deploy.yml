name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy-dev:
    name: Deploy dev (staging)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy (bolao-api-dev)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

      - uses: actions/setup-node@v4
        with:
          # Vercel CLI's `vercel build` fails with "spawn sh ENOENT" on Node 20
          # under ubuntu-24.04 runners; Node 22 doesn't have this issue.
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (preview = dev)
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-prod:
    name: Deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy (bolao-api)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"

      - uses: actions/setup-node@v4
        with:
          # Vercel CLI's `vercel build` fails with "spawn sh ENOENT" on Node 20
          # under ubuntu-24.04 runners; Node 22 doesn't have this issue.
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
